scheming_version: 2
dataset_type: dataset
about: A dataset schema with geographic fields
about_url: https://github.com/ckan/ckanext-scheming

dataset_fields:

# Basic dataset fields
- field_name: title
  label: Title
  preset: title
  form_placeholder: e.g. A descriptive title
  required: true

- field_name: name
  label: URL
  preset: dataset_slug
  form_placeholder: e.g. my-dataset

- field_name: notes
  label: Description
  form_snippet: markdown.html
  form_placeholder: Some useful notes about the data
  required: true

- field_name: tag_string
  label: Tags
  preset: tag_string_autocomplete
  form_placeholder: e.g. environment, geospatial, climate

- field_name: license_id
  label: License
  form_snippet: license.html
  help_text: License definitions and additional information can be found at http://opendefinition.org/

- field_name: owner_org
  label: Organization
  preset: dataset_organization

# Geographic/Spatial fields
- field_name: spatial_coverage
  label: Geographic Coverage
  form_placeholder: e.g. Netherlands, Utrecht, Europe
  help_text: Describe the geographic area covered by this dataset

- field_name: bbox_north
  label: Bounding Box - North
  form_placeholder: e.g. 52.431
  help_text: Northern latitude in decimal degrees
  validators: ignore_missing

- field_name: bbox_south
  label: Bounding Box - South
  form_placeholder: e.g. 52.278
  help_text: Southern latitude in decimal degrees
  validators: ignore_missing

- field_name: bbox_east
  label: Bounding Box - East
  form_placeholder: e.g. 5.079
  help_text: Eastern longitude in decimal degrees
  validators: ignore_missing

- field_name: bbox_west
  label: Bounding Box - West
  form_placeholder: e.g. 4.728
  help_text: Western longitude in decimal degrees
  validators: ignore_missing

- field_name: spatial_bbox
  label: Bounding Box (WKT)
  form_placeholder: e.g. POLYGON((4.728 52.278, 5.079 52.278, 5.079 52.431, 4.728 52.431, 4.728 52.278))
  help_text: Optional advanced field in WKT. Used by ckanext-dcat for dcat:bbox export
  validators: ignore_missing

- field_name: spatial_centroid
  label: Centroid (WKT)
  form_placeholder: e.g. POINT(4.895 52.370)
  help_text: Representative center point in WKT. This is exported by ckanext-dcat as dcat:centroid
  validators: ignore_missing

- field_name: coordinate_system
  label: Coordinate Reference System
  form_placeholder: EPSG:4326
  help_text: The coordinate system (e.g., EPSG:4326 for WGS84)

- field_name: spatial_resolution_in_meters
  label: Spatial Resolution (meters)
  form_placeholder: e.g. 10
  help_text: Spatial resolution in meters. Exported as dcat:spatialResolutionInMeters
  validators: ignore_missing

- field_name: temporal_start
  label: Temporal Coverage Start
  form_placeholder: e.g. 2025-01-01
  help_text: Start date for the period covered by this dataset
  validators: ignore_missing

- field_name: temporal_end
  label: Temporal Coverage End
  form_placeholder: e.g. 2025-12-31
  help_text: End date for the period covered by this dataset
  validators: ignore_missing

# Additional metadata fields
- field_name: author
  label: Author
  form_placeholder: Joe Bloggs
  display_property: dc:creator

- field_name: author_email
  label: Author Email
  form_placeholder: joe@example.com
  display_property: dc:creator

- field_name: maintainer
  label: Maintainer
  form_placeholder: Joe Bloggs
  display_property: dc:contributor

- field_name: maintainer_email
  label: Maintainer Email
  form_placeholder: joe@example.com
  display_property: dc:contributor

# Resource fields
resource_fields:

- field_name: url
  label: URL
  preset: resource_url_upload

- field_name: name
  label: Name
  form_placeholder: e.g. January 2011 Gold Prices

- field_name: description
  label: Description
  form_snippet: markdown.html
  form_placeholder: Some useful notes about the data

- field_name: format
  label: Format
  preset: resource_format_autocomplete

- field_name: wms_layer
  label: WMS Layer Name
  form_placeholder: e.g. TRAMMETRO_LIJNEN_2025
  help_text: Exact layer Name from the WMS GetCapabilities document