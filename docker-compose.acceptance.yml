services:
  ckan:
    # Allow per-environment site URL override from shell/direnv.
    environment:
      CKAN_SITE_URL: ${ACCEPTANCE_CKAN_SITE_URL:-https://example.com}

  nginx:
    # Expose nginx only to NPM through the shared external Docker network.
    networks: !override
      ckannet: {}
      berthaweb:
        aliases:
          - ckan-acceptance-nginx
    # Disable host port publishing in acceptance; NPM reaches nginx via berthaweb.
    ports: !reset []

networks:
  berthaweb:
    external: true
    name: berthaweb
